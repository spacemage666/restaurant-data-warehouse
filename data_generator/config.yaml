  - {ingredient_name: carrot, category: raw_material, storage: chilled, unit: g, shelf_life_days: 14, price_per_unit: 16}
  - {ingredient_name: potato, category: raw_material, storage: dry, unit: g, shelf_life_days: 21, price_per_unit: 13}
