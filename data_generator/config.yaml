# Demand model for daily order generator

demand:
  base_orders_per_day: 60
  weekend_multiplier: 1.3
  noise_sd: 0.12
  hourly_share:
    10: 0.03
    11: 0.10
    12: 0.22
    13: 0.18
    14: 0.07
    15: 0.04
    16: 0.04
    17: 0.08
    18: 0.12
    19: 0.09
    20: 0.03
  portions_per_order:
    1: 0.70
    2: 0.25
    3: 0.05
  menu_mix:
    Kitsune Chicken Curry: 0.6
    Kitsune Beef Curry: 0.4
production:
  forecast_window_days: 14
  safety_factor: 1.05

inventory:
  forecast_window_days: 7
  safety_factor: 1.15
  restock_cycle_days:
    frozen: 7
    chilled: 3
    dry: 7
    unspecified: 7