# ============================================================
# Control Panel - Data Warehouse for Restaurant and Food Waste Prediction

# Unit Description:
# - All ingredients using basic unit grammation: gram, ml, atau pcs
# - price_per_unit = price for 1 gram / 1 ml/ 1 pcs
# - Numbers below "recipe" = all ingredients for 1 PORTION.
# ============================================================

seed: 42
n_outlets: 17
start_date: "2025-01-01"
end_date: "2025-01-31"
price_as_of: "2026-04-14"

cities: [Jakarta, Bandung, Surabaya, Yogyakarta, Semarang, Medan]

location_types:
  mal: 1.4
  campus: 1.1
  canteen: 1.0
  food court: 0.8

# Ingredients
# category: raw_material | prepared | packaging | utility
# shelf_life_days = Assumptions
ingredients:
  # --- Fresh Ingredients ---
  - {ingredient_name: beef_meat, category: raw material, storage: frozen, unit: g, shelf_life_days: 90, thawed_shelf_life_day: 3, price_per_unit: 120}
  - {ingredient_name: chicken_fillet, category: raw_material, storage: frozen, unit: g, shelf_life_days: 90, thawed_shelf_life_days: 2, price_per_unit: 40}
